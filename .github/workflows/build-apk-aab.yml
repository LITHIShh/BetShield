
name: Build APK and Play Store AAB

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BetShield Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Find the actual Android project root
      - name: Locate Android Gradle Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd
          ls -la

          echo "Searching for Gradle project files..."

          find . -maxdepth 5 -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print

          PROJECT_DIR=""

          # Prefer a project root containing its own Gradle wrapper.
          while IFS= read -r file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/gradlew" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -maxdepth 5 -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle project with a gradlew wrapper was found."
            echo "Check that settings.gradle(.kts) and gradlew are committed."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 4. Verify and use the project's existing Gradle wrapper
      - name: Verify Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Gradle version:"
          ./gradlew --version

      # 5. Build Debug APK
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 6. Build Release AAB
      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      # 7. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BetShield-Debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 8. Upload Release AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetShield-PlayStore-AAB
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
