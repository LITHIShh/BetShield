
name: Build BetShield APK and AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -la

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || \
               [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find . -maxdepth 7 -type f \
              \( -name "settings.gradle.kts" \
              -o -name "settings.gradle" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*" | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found."
            echo "Ensure settings.gradle.kts and app/build.gradle.kts exist."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set Up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle Version
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --version

      - name: Check Gradle Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle tasks --stacktrace --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle bundleRelease --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BetShield-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetShield-Release-AAB
          path: "**/build/outputs/bundle/release/*.aab"
          if-no-files-found: error
          retention-days: 30
