name: UrgeVault CI - Build APK & Play Store AAB
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
jobs:
  build:
    name: Build Android APKs and AAB Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew
      - name: Generate Production Signing Keystore
        run: |
          keytool -genkey -v -keystore app/release.jks \
            -alias betshield \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BetShield@2026 \
            -keypass BetShield@2026 \
            -dname "CN=UrgeVault, OU=Mobile, O=UrgeVault, L=SanFrancisco, S=CA, C=US"
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Build Release APK and Play Store AAB
        run: |
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease --stacktrace
