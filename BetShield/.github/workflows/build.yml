name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Run Gradlew
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "ERROR: gradlew file not found anywhere in the repository!"
          echo "Please ensure you uploaded the full Android project files."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew in: $PROJECT_DIR"
        chmod +x "$GRADLEW_PATH"
        
        echo "::group::Building APK"
        cd "$PROJECT_DIR" && ./gradlew assembleDebug
        echo "::endgroup::"
        
        echo "::group::Building AAB"
        cd "$PROJECT_DIR" && ./gradlew bundleRelease || echo "AAB Build failed, moving on..."
        echo "::endgroup::"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BetShield-APK
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: BetShield-AAB
        path: "**/build/outputs/bundle/release/*.aab"
